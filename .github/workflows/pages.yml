name: Xem thử trên GitHub Pages
# BẢN TÁCH PH1: dựng giao diện và đưa lên https://da-kdi.github.io/PH1-hethongSTEM/ mỗi khi đẩy lên main.
# Dùng CSDL demo của .env.example (khoá publishable, chỉ dành cho trình duyệt). Không đi theo patch ghép về repo chính.
on:
  push:
    branches: [main]
    paths-ignore: ['supabase/**', 'docs/**']
  workflow_dispatch:

permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: cp .env.example .env && npm run build
        env: { VITE_BASE: '/${{ github.event.repository.name }}/' }
      # Mở thẳng một đường dẫn con / tải lại trang vẫn vào ứng dụng
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deploy
        uses: actions/deploy-pages@v4
