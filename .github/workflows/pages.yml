name: Xem thử trên GitHub Pages
# BẢN TÁCH PH1: dựng giao diện và đưa lên https://da-kdi.github.io/PH1-hethongSTEM/ mỗi khi đẩy lên main.
# Dùng CSDL RIÊNG của PH1: biến repo PH1_SUPABASE_URL, PH1_SUPABASE_ANON_KEY (khoá publishable). Không đi theo patch ghép về repo chính.
on:
  push:
    branches: [main]
    paths-ignore: ['supabase/**', 'docs/**']
  workflow_dispatch:

permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Dựng giao diện (trỏ vào CSDL riêng của PH1)
        env:
          VITE_BASE: '/${{ github.event.repository.name }}/'
          VITE_SUPABASE_URL: ${{ vars.PH1_SUPABASE_URL || secrets.PH1_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.PH1_SUPABASE_ANON_KEY || secrets.PH1_SUPABASE_ANON_KEY }}
        run: |
          [ -n "$VITE_SUPABASE_URL" ] && [ -n "$VITE_SUPABASE_ANON_KEY" ] || { echo "::error::Chưa đặt PH1_SUPABASE_URL / PH1_SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions, tab Variables hoặc Secrets, đúng tên, ở mức repository)"; exit 1; }
          npm run build
      # Mở thẳng một đường dẫn con / tải lại trang vẫn vào ứng dụng
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deploy
        uses: actions/deploy-pages@v4
