name: Kiểm thử CSDL (RLS, cách ly dữ liệu)
on:
  push:
    paths: ['supabase/**', '.github/workflows/db-tests.yml']
  pull_request:
    paths: ['supabase/**', '.github/workflows/db-tests.yml']
  workflow_dispatch:

# BẢN TÁCH PH1: chỉ kiểm thử trên CSDL tạm trong CI. Đã bỏ các job migrate / deploy-functions / schema-diff của repo chính
# để repo này KHÔNG BAO GIỜ ghi vào Supabase thật. Migration của PH1 lên CSDL thật chỉ đi qua repo chính (docs/GHEP-VE-REPO-CHINH.md).
jobs:
  isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@v4
      # Lượt 1: migration không có dữ liệu mẫu → CSDL sạch. Lượt 2: có dữ liệu mẫu → kiểm thử cách ly.
      - run: supabase/tests/run.sh lms_test


  # Hàm máy chủ (supabase/functions): kiểm tra kiểu trên mọi PR/push.
  functions-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.1.4 }
      - run: for f in supabase/functions/*/index.ts; do deno check --node-modules-dir=none "$f"; done
